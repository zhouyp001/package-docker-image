name: Package & Release Docker Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: '镜像地址，例如 nginx:1.25.3'
        required: true
      release_tag:
        description: 'Release tag（留空则自动推断）'
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull & package & release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh \
            --image "${{ inputs.image }}" \
            --tag "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}"