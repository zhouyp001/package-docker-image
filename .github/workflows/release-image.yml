name: Package & Release Docker Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: '镜像地址，例如 nginx:1.25.3'
        required: true
      release_tag:
        description: 'Release tag（留空则自动推断）'
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull & package & release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          chmod +x scripts/package-release.sh
          ARGS=(--image "${{ inputs.image }}" --repo "${{ github.repository }}")
          if [[ -n "$RELEASE_TAG" ]]; then
            ARGS+=(--tag "$RELEASE_TAG")
          fi
          ./scripts/package-release.sh "${ARGS[@]}"